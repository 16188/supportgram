<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="tgblue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2AABEE"/>
      <stop offset="100%" stop-color="#229ED9"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offset"/>
      <feFlood flood-color="#000" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Architecture</text>

  <!-- ========== VISITOR BROWSER ========== -->
  <g filter="url(#shadow)">
    <rect x="30" y="70" width="200" height="200" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  </g>
  <rect x="30" y="70" width="200" height="36" rx="12" fill="url(#blue)"/>
  <rect x="30" y="94" width="200" height="12" fill="url(#blue)"/>
  <!-- Browser icon -->
  <circle cx="50" cy="88" r="5" fill="#fff" opacity="0.3"/>
  <circle cx="65" cy="88" r="5" fill="#fff" opacity="0.3"/>
  <circle cx="80" cy="88" r="5" fill="#fff" opacity="0.3"/>
  <text x="130" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">Visitor Browser</text>

  <!-- Widget mockup -->
  <rect x="55" y="120" width="150" height="130" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <rect x="55" y="120" width="150" height="28" rx="8" fill="#1e8fd5"/>
  <rect x="55" y="140" width="150" height="8" fill="#1e8fd5"/>
  <text x="130" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">Contact Us</text>

  <!-- Chat bubbles -->
  <rect x="65" y="158" width="85" height="16" rx="8" fill="#334155"/>
  <rect x="95" y="180" width="100" height="16" rx="8" fill="#1e8fd5" opacity="0.8"/>
  <rect x="65" y="202" width="70" height="16" rx="8" fill="#334155"/>

  <!-- Input bar -->
  <rect x="62" y="225" width="136" height="18" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="90" y="237" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">Type a message...</text>

  <text x="130" y="280" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">widget.js &lt; 15KB</text>

  <!-- ========== VERCEL BACKEND ========== -->
  <g filter="url(#shadow)">
    <rect x="330" y="70" width="240" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  </g>
  <rect x="330" y="70" width="240" height="36" rx="12" fill="url(#teal)"/>
  <rect x="330" y="94" width="240" height="12" fill="url(#teal)"/>
  <!-- Vercel triangle icon -->
  <polygon points="350,92 358,80 366,92" fill="#fff" opacity="0.4"/>
  <text x="450" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">Vercel Serverless</text>

  <!-- API routes -->
  <rect x="350" y="122" width="200" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="450" y="142" text-anchor="middle" font-family="monospace" font-size="11" fill="#06b6d4">POST /api/conversations</text>

  <rect x="350" y="162" width="200" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="450" y="182" text-anchor="middle" font-family="monospace" font-size="11" fill="#06b6d4">GET  /api/conversations</text>

  <rect x="350" y="202" width="200" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="450" y="222" text-anchor="middle" font-family="monospace" font-size="11" fill="#06b6d4">POST /api/tg/:key</text>

  <rect x="350" y="242" width="200" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="450" y="262" text-anchor="middle" font-family="monospace" font-size="11" fill="#06b6d4">GET  /api/resume</text>

  <!-- Database -->
  <g transform="translate(375, 295)">
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="#4FF8D2" opacity="0.15" stroke="#4FF8D2" stroke-width="1"/>
    <rect x="0" y="10" width="150" height="40" fill="#0f172a" stroke="#4FF8D2" stroke-width="1" opacity="0.4"/>
    <ellipse cx="75" cy="50" rx="75" ry="12" fill="#0f172a" stroke="#4FF8D2" stroke-width="1" opacity="0.4"/>
    <ellipse cx="75" cy="10" rx="75" ry="12" fill="none" stroke="#4FF8D2" stroke-width="1"/>
    <text x="75" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4FF8D2">Turso / libSQL</text>
  </g>

  <!-- Cron -->
  <rect x="350" y="375" width="200" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="450" y="391" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748b">cron: 90-day purge @ 8am</text>

  <!-- ========== TELEGRAM ========== -->
  <g filter="url(#shadow)">
    <rect x="670" y="70" width="200" height="260" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  </g>
  <rect x="670" y="70" width="200" height="36" rx="12" fill="url(#tgblue)"/>
  <rect x="670" y="94" width="200" height="12" fill="url(#tgblue)"/>
  <!-- TG icon -->
  <path d="M695,82 L708,92 L700,96 L697,93 Z" fill="#fff" opacity="0.5"/>
  <text x="770" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">Telegram</text>

  <!-- Supergroup box -->
  <rect x="690" y="120" width="160" height="28" rx="6" fill="#0f172a" stroke="#2AABEE" stroke-width="1" opacity="0.6"/>
  <text x="770" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#2AABEE">Tenant Supergroup</text>

  <!-- Topic threads -->
  <rect x="700" y="160" width="140" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <circle cx="715" cy="172" r="6" fill="#22c55e" opacity="0.7"/>
  <text x="730" y="176" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Jane - acme.com</text>

  <rect x="700" y="192" width="140" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <circle cx="715" cy="204" r="6" fill="#22c55e" opacity="0.7"/>
  <text x="730" y="208" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Bob - shop.io</text>

  <rect x="700" y="224" width="140" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <circle cx="715" cy="236" r="6" fill="#f59e0b" opacity="0.7"/>
  <text x="730" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Tom - dev.co</text>

  <!-- Agent commands -->
  <rect x="690" y="262" width="160" height="52" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="770" y="280" text-anchor="middle" font-family="monospace" font-size="10" fill="#94a3b8">Agent commands:</text>
  <text x="770" y="296" text-anchor="middle" font-family="monospace" font-size="10" fill="#22c55e">/close  /note  reply</text>

  <!-- ========== EMAIL ========== -->
  <g filter="url(#shadow)">
    <rect x="670" y="370" width="200" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  </g>
  <rect x="670" y="370" width="200" height="32" rx="12" fill="url(#purple)"/>
  <rect x="670" y="390" width="200" height="12" fill="url(#purple)"/>
  <text x="770" y="391" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff">SendGrid Email</text>
  <text x="770" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">"You have a reply" + resume link</text>

  <!-- ========== ARROWS ========== -->

  <!-- Visitor -> Vercel: POST messages -->
  <line x1="230" y1="145" x2="330" y2="138" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="330,138 320,132 320,144" fill="#3b82f6"/>
  <text x="280" y="128" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">POST</text>

  <!-- Vercel -> Visitor: poll response -->
  <line x1="330" y1="178" x2="230" y2="185" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="230,185 240,179 240,191" fill="#3b82f6"/>
  <text x="280" y="198" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">poll</text>

  <!-- Vercel -> Telegram: Bot API -->
  <line x1="570" y1="138" x2="670" y2="138" stroke="#2AABEE" stroke-width="2"/>
  <polygon points="670,138 660,132 660,144" fill="#2AABEE"/>
  <text x="620" y="128" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">Bot API</text>

  <!-- Telegram -> Vercel: webhook -->
  <line x1="670" y1="218" x2="570" y2="218" stroke="#2AABEE" stroke-width="2"/>
  <polygon points="570,218 580,212 580,224" fill="#2AABEE"/>
  <text x="620" y="242" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">webhook</text>

  <!-- Vercel -> Email -->
  <line x1="550" y1="380" x2="670" y2="395" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="670,395 660,389 660,401" fill="#8b5cf6"/>
  <text x="610" y="378" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">offline reply</text>

  <!-- Email -> Visitor -->
  <path d="M 670 420 Q 450 460 180 270" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
  <polygon points="180,270 188,264 190,276" fill="#8b5cf6"/>
  <text x="400" y="455" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">resume link</text>

  <!-- Legend -->
  <g transform="translate(30, 430)">
    <text x="0" y="12" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Legend:</text>
    <line x1="55" y1="8" x2="85" y2="8" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="90" y="12" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">HTTP</text>
    <line x1="125" y1="8" x2="155" y2="8" stroke="#2AABEE" stroke-width="2"/>
    <text x="160" y="12" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Telegram API</text>
    <line x1="245" y1="8" x2="275" y2="8" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="280" y="12" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Email</text>
  </g>
</svg>
