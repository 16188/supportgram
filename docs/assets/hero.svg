<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2AABEE"/>
      <stop offset="100%" stop-color="#229ED9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/><line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/><line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/><line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="280" x2="900" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="320"/><line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/><line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/><line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/><line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- Telegram plane icon -->
  <g transform="translate(70, 100)">
    <circle cx="55" cy="55" r="55" fill="url(#tg)"/>
    <path d="M30 56l10 10 35-30" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M40 66l-3 18 15-10" fill="#fff" opacity="0.9"/>
    <path d="M80 36L30 56l10 10 35-30z" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Title text -->
  <text x="210" y="115" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#f8fafc" letter-spacing="-1">Supportgram</text>

  <!-- Tagline -->
  <text x="210" y="155" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#94a3b8">Open-source Telegram live chat widget for websites</text>

  <!-- Feature pills -->
  <g transform="translate(210, 180)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e3a5f" opacity="0.8"/>
    <text x="65" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#38bdf8">Forum Topics</text>

    <rect x="145" y="0" width="130" height="32" rx="16" fill="#1e3a5f" opacity="0.8"/>
    <text x="210" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#38bdf8">Multi-tenant</text>

    <rect x="290" y="0" width="140" height="32" rx="16" fill="#1e3a5f" opacity="0.8"/>
    <text x="360" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#38bdf8">&lt; 15 KB Widget</text>

    <rect x="445" y="0" width="145" height="32" rx="16" fill="#1e3a5f" opacity="0.8"/>
    <text x="517" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#38bdf8">Email Resume</text>
  </g>

  <!-- Decorative line -->
  <rect x="210" y="232" width="500" height="2" rx="1" fill="url(#accent)" opacity="0.4"/>

  <!-- Bottom tagline -->
  <text x="210" y="265" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">Your support desk is an app your team already has open.</text>

  <!-- Version badge -->
  <g transform="translate(730, 25)">
    <rect width="110" height="26" rx="13" fill="#1e3a5f" opacity="0.6"/>
    <text x="55" y="17" text-anchor="middle" font-family="monospace" font-size="12" fill="#38bdf8">v0.1.0 | MIT</text>
  </g>
</svg>
